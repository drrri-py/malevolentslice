[project]
name = "malevolentslice"
version = "0.1.2"
description = "Memory-efficient VAD-based audio dataset segmentation for TTS training"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Fidriyani", email = "fiddry30@gmail.com" }]
keywords = [
    "audio",
    "voice-activity-detection",
    "vad",
    "text-to-speech",
    "tts",
    "silero-vad",
    "audio-segmentation",
    "ljspeech",
    "memory-efficient",
    "speech-dataset"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "soundfile>=0.12.0",
    "onnxruntime>=1.14.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

[project.urls]
"Homepage" = "https://github.com/drrri-py/malevolentslice"
"Repository" = "https://github.com/drrri-py/malevolentslice"
"Bug Tracker" = "https://github.com/drrri-py/malevolentslice/issues"
"License" = "https://github.com/drrri-py/malevolentslice/blob/main/LICENSE"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "memory-profiler>=0.61.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]
asr = [
    "faster-whisper>=1.0.0",
]

[project.scripts]
malevolentslice = "malevolentslice.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
malevolentslice = ["assets/*.onnx"]
