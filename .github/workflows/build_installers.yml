name: Build Standalone Installers (DMG & EXE)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[gui] pyinstaller soundfile

      - name: Build Standalone .app and .dmg
        run: |
          python build_standalone.py --clean

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: MalevolentSliceStudio-macOS-DMG
          path: dist/*.dmg

  build-windows:
    name: Build Windows (.exe Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[gui] pyinstaller soundfile

      - name: Build PyInstaller bundle
        run: |
          python build_standalone.py --clean

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Setup.exe with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_installer.iss

      - name: Upload Windows Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: MalevolentSliceStudio-Windows-Setup
          path: dist/installer/*.exe
